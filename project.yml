name: ShouDeng
options:
  bundleIdPrefix: com.shoudeng
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

configs:
  Debug: debug
  Beta: release
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
  configs:
    Beta:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: BETA

packages:
  firebase-ios-sdk:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "11.0.0"

targets:
  ShouDeng:
    type: application
    platform: iOS
    sources:
      - path: ShouDeng
        excludes:
          - "**/*.md"
          - Models/GuardianActivityAttributes.swift
      - path: Shared
    dependencies:
      - package: firebase-ios-sdk
        product: FirebaseAuth
      - package: firebase-ios-sdk
        product: FirebaseCrashlytics
      - target: ShouDengWidgets
        embed: true
    info:
      path: ShouDeng/Info.plist
      properties:
        CFBundleDisplayName: "守灯"
        CFBundleName: "ShouDeng"
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - location
          - fetch
          - remote-notification
        NSLocationAlwaysAndWhenInUseUsageDescription: "守灯需要始终访问您的位置，以便在紧急情况下向家人报告您的位置，并在您进出安全区时通知守护者。"
        NSLocationWhenInUseUsageDescription: "守灯需要访问您的位置以显示您的当前位置，并在紧急求助时向家人发送位置信息。"
        NSMotionUsageDescription: "守灯使用运动传感器检测跌倒等异常情况，在您无法主动求助时自动通知家人。"
        NSMicrophoneUsageDescription: "仅在触发紧急求助时使用麦克风录制环境音，帮助守护者判断现场情况。录音需当地法律许可，部分地区要求所有在场者同意。"
        NSPhotoLibraryUsageDescription: "允许在家庭圈中分享照片。您的照片仅对守护关系内的家人可见。"
        NSContactsUsageDescription: "守灯需要访问您的通讯录，以便快速添加紧急联络人信息。"
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - "com.googleusercontent.apps.561070924965-7ggg6418ktbb9bndt30oqpm9fireoq2j"
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
    settings:
      base:
        INFOPLIST_FILE: ShouDeng/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.shoudeng.app
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    entitlements:
      path: ShouDeng/ShouDeng.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.shoudeng.app
        com.apple.developer.usernotifications.critical-alerts: true
        aps-environment: production
        com.apple.developer.associated-domains:
          - applinks:shoudeng.app
          - applinks:www.shoudeng.app

  ShouDengWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: ShouDengWidgets
      - path: Shared
    info:
      path: ShouDengWidgets/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shoudeng.app.widgets
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: "NO"
        SWIFT_EMIT_LOC_STRINGS: "YES"
    entitlements:
      path: ShouDengWidgets/ShouDengWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.shoudeng.app

  ShouDengTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ShouDengTests
        excludes:
          - "**/*.md"
    dependencies:
      - target: ShouDeng
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shoudeng.app.tests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/ShouDeng.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/ShouDeng"
        BUNDLE_LOADER: "$(TEST_HOST)"
